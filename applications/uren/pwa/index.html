<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11131A" />
    <meta name="robots" content="noindex" />
    <title>IMeTech Uren is verhuisd</title>
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11131a; color: #f2f3f7;
             font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 26rem; padding: 2rem 1.5rem; }
      h1 { font-size: 1.4rem; margin: 0 0 .75rem; }
      p { line-height: 1.5; color: #c5c8d3; margin: 0 0 1rem; }
      a.knop { display: inline-block; background: #8b8cf7; color: #11131a; font-weight: 600; text-decoration: none;
               padding: .8rem 1.4rem; border-radius: 999px; }
      small { display: block; margin-top: 1.25rem; color: #8c90a0; line-height: 1.4; }
    </style>
  </head>
  <body>
    <main>
      <h1>De uren-app is verhuisd</h1>
      <p>Uren, projecten en inzicht houd je nu bij in de nieuwe app op de server. Deze oude app schrijft niet meer naar Excel.</p>
      <a class="knop" href="https://apps.imetech.nl/uren/">Naar de nieuwe Uren-app</a>
      <small>Je gaat over een paar tellen vanzelf door. Staat deze oude app op je startscherm, haal hem daar dan weg en zet de nieuwe erop.</small>
    </main>
    <script>
      // De oude versie stond in de cache van het toestel: die ruimen we op, zodat deze pagina altijd de nieuwste is.
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js").catch(function () {});
      setTimeout(function () { location.href = "https://apps.imetech.nl/uren/"; }, 4000);
    </script>
  </body>
</html>
